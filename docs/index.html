<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Follow one prediction of the nanolm language model through every layer, from the prompt to the next word.">
<title>Once Upon a Forward Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a station track across the top, one instrument panel per step, and a "in hand" readout of the data at the bottom of the panel */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #16202b;
  --muted: #5a6776;
  --line: #d6dde5;
  --accent: #2f5bea;      /* positive values, attention, kept tokens */
  --warm: #d9662a;        /* negative values, the predicted word */
  --soft: #e6ebf8;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #161d26; --ink: #e5eaf0; --muted: #94a1b0; --line: #2a3542;
    --accent: #7d9bff; --warm: #f2985a; --soft: #1d2840; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #161d26; --ink: #e5eaf0; --muted: #94a1b0; --line: #2a3542;
  --accent: #7d9bff; --warm: #f2985a; --soft: #1d2840; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }

header h1 {
  font-family: var(--display); font-weight: 700; font-size: clamp(28px, 4.4vw, 42px);
  line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance;
}
header h1 .q { color: var(--warm); }
header p { margin: 8px 0 0; color: var(--muted); max-width: 64ch; }

/* Station track */
.track-scroll { overflow-x: auto; padding-bottom: 4px; }
.track { display: flex; gap: 14px; min-width: max-content; }
.group { display: grid; gap: 6px; }
.group-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600;
  border-bottom: 1px solid var(--line); padding-bottom: 4px;
}
.stations { display: flex; gap: 4px; }
.station {
  font: 500 12px/1 var(--body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; cursor: pointer; white-space: nowrap;
}
.station:hover { border-color: var(--accent); color: var(--ink); }
.station.done { color: var(--ink); background: var(--soft); border-color: transparent; }
.station.now { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.station:focus-visible, button:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

/* Panel */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  display: grid; grid-template-rows: auto 1fr auto; min-height: 520px;
}
.panel-head { padding: 22px 24px 0; display: grid; gap: 6px; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; }
.panel-head h2 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; line-height: 1.15; }
.lede { margin: 0; max-width: 72ch; }
.stage { padding: 20px 24px 24px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.stage.enter { animation: rise 280ms ease-out; }
@keyframes rise { from { opacity: 0.35; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.inhand {
  border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
  font-family: var(--mono); font-size: 13px;
}
.inhand .k { font-family: var(--body); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.inhand .v { min-width: 0; overflow-wrap: anywhere; }

.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls .count { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: auto; font-size: 14px; }
.btn {
  font: 600 15px/1 var(--body); border-radius: 10px; padding: 12px 18px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); min-width: 150px; }
.hint { color: var(--muted); font-size: 13px; }

/* Shared visual pieces */
.mono { font-family: var(--mono); }
.label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  font-family: var(--mono); font-size: 18px; padding: 8px 12px; border-radius: 8px;
  background: var(--soft); border: 1px solid var(--line); white-space: pre;
}
.chip.small { font-size: 13px; padding: 4px 7px; }
.chip.hot { background: var(--warm); color: var(--surface); border-color: var(--warm); }
.chip .sub { display: block; font-size: 11px; color: var(--muted); text-align: center; margin-top: 2px; }
.chip.hot .sub { color: var(--surface); }
.arrow { color: var(--muted); font-family: var(--mono); }
.bigtext { font-family: var(--display); font-size: clamp(34px, 7vw, 64px); font-weight: 500; line-height: 1.1; }
.bigtext .new { color: var(--warm); font-weight: 700; }
.caret { display: inline-block; width: 0.08em; height: 0.9em; background: var(--accent); vertical-align: -0.08em; margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.cols > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.note { color: var(--muted); font-size: 13.5px; margin: 0; }

/* Merge trace */
.trace { display: grid; gap: 6px; }
.trace-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.trace-row .why { font-size: 12.5px; color: var(--muted); font-family: var(--mono); min-width: 150px; }
.sym { font-family: var(--mono); font-size: 14px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); white-space: pre; }
.sym.fresh { background: var(--accent); color: var(--surface); border-color: var(--accent); }

/* Vector strips */
.strip { display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 1px; border-radius: 4px; overflow: hidden; }
.strip i { display: block; aspect-ratio: 1 / 2.2; }
.vrow { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: center; }
.vrow .tag { font-family: var(--mono); font-size: 13px; white-space: pre; text-align: right; }
.legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* Attention matrix */
.matrix { display: grid; gap: 3px; width: max-content; }
.matrix .cell {
  width: 40px; height: 30px; border-radius: 4px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
}
.matrix .cell.focus { outline: 1.5px solid var(--warm); outline-offset: -1.5px; }
.matrix .rowhead.focus { color: var(--warm); font-weight: 600; }
.matrix .colhead { writing-mode: vertical-rl; transform: rotate(180deg); justify-items: start; padding-bottom: 4px; }
.scroll { overflow-x: auto; }
.grid-sm { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.grid-sm > * { min-width: 0; }
.chip.wide { white-space: normal; width: fit-content; max-width: 100%; }
.lens-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.lens { display: grid; gap: 6px; padding: 8px; border-radius: 8px; }
.lens.on { background: var(--soft); }
.matrix .cell.off { background: repeating-linear-gradient(45deg, transparent 0 5px, var(--line) 5px 6px); color: transparent; }
.matrix .head { font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; place-items: center; white-space: pre; }
.matrix .rowhead { justify-items: end; padding-right: 6px; }
.heads { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.mini { display: grid; gap: 1px; cursor: pointer; border: 1px solid var(--line); border-radius: 4px; padding: 2px; background: var(--surface); }
.mini.sel { border-color: var(--warm); box-shadow: 0 0 0 1px var(--warm); }
.mini i { aspect-ratio: 1; display: block; border-radius: 1px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { font: 500 12px/1 var(--body); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* Bars */
.bars { display: grid; gap: 5px; }
.bar { display: grid; grid-template-columns: 80px 1fr 56px; gap: 10px; align-items: center; font-size: 13px; }
.bar .t { font-family: var(--mono); white-space: pre; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.bar .track-b { height: 16px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 500ms ease; }
.bar.win .fill { background: var(--warm); }
.bar.two { grid-template-columns: 80px 1fr 52px 56px; }
.bar.head-row { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.bar.drop { opacity: 0.38; }
.bar .n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }

.meter { display: grid; grid-template-columns: 160px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
.meter .track-b { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.meter .fill { height: 100%; background: var(--muted); border-radius: 999px; }

/* Sampling wheel (a stacked bar with a needle) */
.roulette { position: relative; height: 64px; border-radius: 8px; overflow: hidden; display: flex; border: 1px solid var(--line); }
.roulette span { height: 100%; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; color: var(--surface); white-space: pre; overflow: hidden; }
.needle { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--ink); left: 0; transition: left 1100ms cubic-bezier(.2,.8,.2,1); }
.needle::after { content: ""; position: absolute; top: 0; left: -5px; border: 6.5px solid transparent; border-top-color: var(--ink); }

.flow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

@media (max-width: 560px) {
  .panel-head, .stage { padding-left: 16px; padding-right: 16px; }
  .inhand { padding-left: 16px; padding-right: 16px; }
  .matrix .cell { width: 30px; height: 26px; font-size: 9.5px; }
  .vrow { grid-template-columns: 56px 1fr; }
  .bar { grid-template-columns: 70px 1fr 54px; }
  .bar.two { grid-template-columns: 64px 1fr 48px 52px; font-size: 12px; }
  .meter { grid-template-columns: 120px 1fr 46px; }
  .heads { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  .stage.enter, .caret { animation: none; }
  .needle, .bar .fill { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="headline"></h1>
    <p>Follow one prediction through every layer of the model, from the text you type to the word it writes next. All numbers come from the nanolm model (22.7 million weights, 10,000-token vocabulary) after a short training run of 600 steps on TinyStories.</p>
  </header>

  <div class="track-scroll"><nav class="track" id="track" aria-label="Steps"></nav></div>

  <section class="panel" aria-live="polite">
    <div class="panel-head">
      <div class="eyebrow" id="eyebrow"></div>
      <h2 id="title"></h2>
      <p class="lede" id="lede"></p>
    </div>
    <div class="stage" id="stage"></div>
    <div class="inhand"><span class="k">In hand</span><span class="v" id="inhand"></span></div>
  </section>

  <div class="controls">
    <span class="count" id="count"></span>
    <span class="hint">Arrow keys work too</span>
    <button class="btn" id="back" type="button">Back</button>
    <button class="btn primary" id="next" type="button">Next step</button>
  </div>
</div>

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p) => (p * 100).toFixed(p > 0.995 && p < 1 ? 2 : p >= 0.1 ? 0 : 1) + "%";
const tokChip = (t, sub, hot) => `<span class="chip${hot ? " hot" : ""}">${esc(t)}${sub !== undefined ? `<span class="sub">${esc(sub)}</span>` : ""}</span>`;
const pct1 = (p) => (p * 100).toFixed(1) + "%";
const mono = (t) => `<span class="mono">${esc(t)}</span>`;
const PICK = D.pick.token;
const T = D.tokens.length;
const LAST = D.tokens[T - 1];
const [FIRST, SECOND] = D.final;
const NUM_BLOCKS = D.blocks.length;

document.getElementById("headline").innerHTML = `${esc(D.prompt)} <span class="q">?</span>`;

function strip(values) {
  const max = Math.max(...values.map(Math.abs)) || 1;
  return `<div class="strip">${values.map((v) => {
    const a = Math.round((Math.abs(v) / max) * 100);
    return `<i title="${v}" style="background: color-mix(in srgb, var(${v >= 0 ? "--accent" : "--warm"}) ${a}%, var(--bg))"></i>`;
  }).join("")}</div>`;
}
const vecLegend = `<div class="legend"><span><i class="sw" style="background: var(--accent)"></i>positive</span><span><i class="sw" style="background: var(--warm)"></i>negative</span><span>stronger color = larger number; the first 48 of 512 numbers are shown</span></div>`;

function bars(items, opts = {}) {
  const max = opts.max ?? Math.max(...items.map((x) => x.v));
  return `<div class="bars">${items.map((x) => `
    <div class="bar${x.token === PICK ? " win" : ""}${x.drop ? " drop" : ""}">
      <span class="t">${esc(x.token)}</span>
      <span class="track-b"><span class="fill" style="width:${Math.max(0, (x.v / max) * 100)}%"></span></span>
      <span class="n">${opts.fmt ? opts.fmt(x.v) : pct(x.v)}</span>
    </div>`).join("")}</div>`;
}
const lensBars = (lens, k = 5) => bars(lens.slice(0, k).map((x) => ({ token: x.token, v: x.p })), { max: 1 });
const lensNote = `<p class="note">This applies the model's final output layer to the vector of ${mono(LAST)} at this point. It shows which next word the vector already points to.</p>`;

function matrix(w) {
  let html = `<div class="matrix" style="grid-template-columns: auto repeat(${T}, auto)"><span></span>`;
  D.tokens.forEach((t) => (html += `<span class="head colhead">${esc(t)}</span>`));
  w.forEach((row, i) => {
    html += `<span class="head rowhead${i === T - 1 ? " focus" : ""}">${esc(D.tokens[i])}</span>`;
    row.forEach((v, j) => {
      if (j > i) { html += `<span class="cell off" title="later token: hidden"></span>`; return; }
      const a = Math.round(v * 100);
      html += `<span class="cell${i === T - 1 ? " focus" : ""}" title="${esc(D.tokens[i])} reads ${esc(D.tokens[j])}: ${v}" style="background: color-mix(in srgb, var(--accent) ${a}%, var(--bg)); color: ${a > 55 ? "var(--surface)" : "var(--ink)"}">${v >= 0.995 ? "1" : v >= 0.005 ? v.toFixed(2).slice(1) : ""}</span>`;
    });
  });
  return html + "</div>";
}
function mini(w, idx, sel) {
  let cells = "";
  w.forEach((row, i) => row.forEach((v, j) => {
    cells += j > i ? `<i style="background: var(--line)"></i>` : `<i style="background: color-mix(in srgb, var(--accent) ${Math.round(v * 100)}%, var(--bg))"></i>`;
  }));
  return `<button class="mini${sel ? " sel" : ""}" style="grid-template-columns: repeat(${T}, 1fr)" data-head="${idx}" type="button" aria-label="Head ${idx + 1}">${cells}</button>`;
}

const inHandIds = (ids) => `[${ids.join(", ")}]`;
const shape = (r, c) => `${r} vectors × ${c} numbers`;

const steps = [];
const add = (s) => steps.push(s);

add({ group: "Text", short: "Prompt", title: "The prompt",
  lede: "Everything starts with plain text. The model's only job is to guess what comes next, one token at a time.",
  hand: `"${esc(D.prompt)}"`,
  render: () => `<div class="bigtext">${esc(D.prompt)}<span class="caret"></span></div>
    <p class="note">Many words could follow "a little": girl, boy, dog, bird. We will see how the model weighs them. First, the tokenizer turns the text into numbers, because the model cannot read letters.</p>` });

add({ group: "BPE Tokenizer", short: "Pre-tokenize", title: "Pre-tokenization",
  lede: "A fixed rule splits the text into words and punctuation, keeping each word's leading space. Later merges never cross from one piece to the next.",
  hand: D.pretokens.map((p) => `"${esc(p.text)}"`).join(" · "),
  render: () => `<div class="chip wide">${esc(D.prompt)}</div><div class="arrow">↓</div>
    <div class="chips">${D.pretokens.map((p) => tokChip(p.text)).join("")}</div>
    <p class="note">${mono("␣")} marks a space. A space belongs to the word after it, so ${mono("␣time")} and ${mono("time")} are different tokens. The comma has no space before it, so it stands alone.</p>` });

add({ group: "BPE Tokenizer", short: "Bytes", title: "Split into bytes",
  lede: "Each piece is written as UTF-8 bytes, numbers from 0 to 255. Every possible text can be written this way, so no input is ever unknown.",
  hand: D.pretokens.map((p) => `[${p.bytes.join(" ")}]`).join(" · "),
  render: () => `<div class="grid-sm">${D.pretokens.map((p) => `<div class="box"><div class="label">"${esc(p.text)}"</div>
    <div class="chips">${p.trace[0].map((s, i) => tokChip(s, p.bytes[i])).join("")}</div></div>`).join("")}</div>` });

add({ group: "BPE Tokenizer", short: "Merges", title: "Replay the learned merges",
  lede: "During training the tokenizer learned 9,743 merges, in order. Within each piece, the earliest-learned pair present is merged first, again and again, until no learned pair is left.",
  hand: D.pretokens.map((p) => `"${esc(p.text)}"`).join(" · ") + " (one token each)",
  render: () => `<div class="grid-sm">${D.pretokens.map((p) => `<div class="box"><div class="label">"${esc(p.text)}"</div><div class="trace">
    <div class="trace-row"><span class="why">bytes</span><span class="chips">${p.trace[0].map((s) => `<span class="sym">${esc(s)}</span>`).join("")}</span></div>
    ${p.trace.length === 1 ? `<div class="trace-row"><span class="why">a single byte: nothing to merge</span></div>` : ""}
    ${p.trace.slice(1).map((st) => {
      const made = st.merge[0] + st.merge[1];
      return `<div class="trace-row"><span class="why">#${st.rank}: ${esc(st.merge[0])} + ${esc(st.merge[1])}</span><span class="chips">${st.symbols.map((s) => `<span class="sym${s === made ? " fresh" : ""}">${esc(s)}</span>`).join("")}</span></div>`;
    }).join("")}</div></div>`).join("")}</div>
    <p class="note">The number is the merge's position in the learned order: a low number means the pair was very common in the training text. ${mono("␣t")} is merge #1, the most common pair of all, and it is the first step of both ${mono("␣time")} and ${mono("␣there")}.</p>` });

add({ group: "BPE Tokenizer", short: "Token IDs", title: "Look up the token IDs",
  lede: "Each final token has a fixed ID in the vocabulary. From here on, the model only works with these numbers.",
  hand: inHandIds(D.ids),
  render: () => `<div class="chips">${D.tokens.map((t, i) => tokChip(t, D.ids[i])).join("")}</div>
    <p class="note">IDs 0 to 255 are the single bytes and 256 is ${mono("<|endoftext|>")}. Every ID above that was created by one merge. The comma is ID 44, its byte value. ${mono("␣a")} appears twice and gets the same ID, 259, both times.</p>` });

add({ group: "Transformer", short: "Embedding", title: "Embedding: IDs become vectors",
  lede: "The embedding table has one row of 512 learned numbers for each of the 10,000 tokens. Each ID simply picks its row.",
  hand: `${inHandIds(D.ids)} → ${shape(T, 512)}`,
  render: () => `<div class="box"><div class="label">One row per token</div>
    ${D.tokens.map((t, i) => `<div class="vrow"><span class="tag">${esc(t)}</span>${strip(D.embedding.vectors[i])}</div>`).join("")}
    ${vecLegend}</div>
    <div class="cols"><div class="box"><div class="label">What the numbers mean</div>
      <p class="note">Nobody chose these numbers. Training moved them so that tokens used in similar ways end up with similar rows. The two ${mono("␣a")} rows are identical: so far each vector knows only its own token, not its neighbors or its position.</p></div>
    <div class="box"><div class="label">Guess if the model stopped here</div>${lensBars(D.embedding.lens)}${lensNote}</div></div>` });

add({ group: "Transformer", short: `Block × ${NUM_BLOCKS}`, title: `Transformer block, repeated ${NUM_BLOCKS} times`,
  lede: `The model stacks ${NUM_BLOCKS} blocks with the same structure. Each has its own weights and starts from the vectors the previous block produced. Each block has two parts, and both add their result to the vectors instead of replacing them.`,
  hand: `${shape(T, 512)} (same shape after every block)`,
  state: { block: 0, head: -1 },
  render: (st) => {
    const b = D.blocks[st.block];
    const w = st.head < 0 ? b.mean : b.heads[st.head];
    const m = Math.max(...D.blocks.map((x) => Math.max(x.attn_change, x.ffn_change)));
    return `
      <div class="cols">
        <div class="box"><div class="label">1 · Attention: tokens read from earlier tokens</div>
          <p class="note">Every token scores itself and the tokens before it, turns the scores into weights that add up to 1, and adds a weighted mix of their information to its own vector. This is the only place where tokens exchange information. RoPE rotates the vectors by position first, so the scores know which tokens are near.</p></div>
        <div class="box"><div class="label">2 · Feed-forward: each vector on its own</div>
          <p class="note">Each vector is checked against 1,344 learned patterns. Every pattern that matches adds its own learned vector, so the result is a combination of what was learned for similar situations. RMSNorm rescales the vector before each part, so neither part sees numbers that are too large or too small.</p></div>
      </div>

      <div class="seg" role="group" aria-label="Choose a block">${D.blocks.map((_, i) => `<button type="button" data-block="${i}" class="${i === st.block ? "on" : ""}">Block ${i + 1}</button>`).join("")}</div>

      <div class="cols">
        <div class="box"><div class="label">Attention weights in block ${st.block + 1}: ${st.head < 0 ? "average of 16 heads" : "head " + (st.head + 1)}</div>
          <div class="scroll">${matrix(w)}</div>
          <p class="note">Each row is one token reading, and it adds up to 1. Hatched cells are later tokens, which a token may not see. The highlighted row is ${mono(LAST)}, whose vector predicts the next word.</p>
          <div class="heads">${b.heads.map((hw, i) => mini(hw, i, i === st.head)).join("")}</div>
          <div class="seg"><button type="button" data-head="-1" class="${st.head < 0 ? "on" : ""}">Average of all heads</button><span class="note">or select one of the 16 heads above</span></div>
        </div>
        <div class="box"><div class="label">The vector of ${esc(LAST)} in block ${st.block + 1}</div>
          <div class="vrow"><span class="tag">before</span>${strip(b.before)}</div>

          <div class="label">Size of what each part added</div>
          <div class="meter"><span>attention</span><span class="track-b"><span class="fill" style="width:${(b.attn_change / m) * 100}%"></span></span><span class="mono">${b.attn_change}</span></div>
          <div class="meter"><span>feed-forward</span><span class="track-b"><span class="fill" style="width:${(b.ffn_change / m) * 100}%"></span></span><span class="mono">${b.ffn_change}</span></div>
          <p class="note">These are the lengths of the two added vectors. The vector itself grows from ${st.block === 0 ? D.embedding.norms[T - 1] : D.blocks[st.block - 1].norm_after} to ${b.norm_after}.</p>

      </div>

      <div class="box"><div class="label">Guess after each block</div>
        <div class="lens-row">${D.blocks.map((x, i) => `<div class="lens${i === st.block ? " on" : ""}"><div class="label">After block ${i + 1}</div>${lensBars(x.lens, 3)}</div>`).join("")}</div>
        ${lensNote}
        <p class="note">${mono(FIRST.token)} leads from the first block. ${mono(SECOND.token)} stays far behind until block ${NUM_BLOCKS}, which raises it from ${pct(D.blocks[NUM_BLOCKS - 2].lens.find((x) => x.token === SECOND.token)?.p ?? 0)} to ${pct(D.blocks[NUM_BLOCKS - 1].lens.find((x) => x.token === SECOND.token)?.p ?? 0)}.</p>
      </div>`;
  } });

add({ group: "Transformer", short: "Output layer", title: "Output layer: one score per word",
  lede: `A final RMSNorm, then one matrix multiplication turns each 512-number vector into 10,000 scores called logits, one per vocabulary token. Only the last position matters here: it scores what follows "${LAST}".`,
  hand: `10,000 logits for the token after "${esc(LAST)}"`,
  render: () => `<div class="cols"><div class="box"><div class="label">The 12 highest of 10,000 logits</div>
      ${bars(D.final.map((x) => ({ token: x.token, v: x.logit })), { fmt: (v) => v.toFixed(2) })}</div>
    <div class="box"><div class="label">What a logit is</div>
      <p class="note">A logit is a raw score with no fixed range. Here they run from ${D.min_logit} to ${D.max_logit}. Only differences matter: a token one point higher is about 2.7 times more likely.</p>
      <p class="note">${mono(FIRST.token)} (${FIRST.logit}) and ${mono(SECOND.token)} (${SECOND.logit}) are almost tied, and both are about 2 points above the rest.</p>
      <p class="note">During training, the scores at the other ${T - 1} positions are used too, because each one predicts the next token of the training text. During generation they are not needed.</p></div></div>` });

let run = 0;
const SORTED = D.final.map((x) => { run += x.p07; return { ...x, run }; });

add({ group: "Text Generation", short: "Temperature", title: "Temperature 0.7: scores become probabilities",
  lede: "The logits are divided by the temperature, then softmax turns them into probabilities that add up to 1. A temperature below 1 makes the likely tokens even more likely.",
  hand: "10,000 probabilities",
  render: () => `<div class="cols">
    <div class="box"><div class="label">Temperature 1 (the model's own probabilities)</div>${bars(D.final.map((x) => ({ token: x.token, v: x.p1 })), { max: 1 })}</div>
    <div class="box"><div class="label">Temperature 0.7</div>${bars(D.final.map((x) => ({ token: x.token, v: x.p07 })), { max: 1 })}</div></div>
    <p class="note">At 0.7, ${mono(FIRST.token)} rises from ${pct(FIRST.p1)} to ${pct(FIRST.p07)} and ${mono(SECOND.token)} from ${pct(SECOND.p1)} to ${pct(SECOND.p07)}. Every less likely word loses probability: ${mono(D.final[2].token)} drops from ${pct(D.final[2].p1)} to ${pct(D.final[2].p07)}.</p>` });

add({ group: "Text Generation", short: "Top-p", title: "Top-p 0.9: drop the long tail",
  lede: "Tokens are sorted from most to least likely and kept until their probabilities add up to 0.9. The rest are dropped, and the kept ones are rescaled to add up to 1 again.",
  hand: `${D.kept} candidates left`,
  render: () => `<div class="cols">
    <div class="box"><div class="label">Sorted, with running total</div>
      <div class="bars"><div class="bar two head-row"><span></span><span></span><span class="n">own</span><span class="n">total</span></div>
      ${SORTED.map((r) => `<div class="bar two${r.pp === 0 ? " drop" : ""}${r.token === PICK ? " win" : ""}"><span class="t">${esc(r.token)}</span>
        <span class="track-b"><span class="fill" style="width:${r.p07 * 100}%"></span></span><span class="n">${pct1(r.p07)}</span><span class="n">${pct1(r.run)}</span></div>`).join("")}</div>
      <p class="note">Each total is the token's own probability plus all the ones above it: ${pct1(FIRST.p07)} + ${pct1(SECOND.p07)} = ${pct1(SORTED[1].run)}. That passes 0.9, so everything after ${mono(SECOND.token)} is dropped (faded).</p></div>
    <div class="box"><div class="label">Kept and rescaled: ${D.kept} of 10,000</div>${bars(D.final.filter((x) => x.pp > 0).map((x) => ({ token: x.token, v: x.pp })), { max: 1, fmt: pct1 })}
      <p class="note">Each kept probability is divided by their total, ${pct1(SORTED[1].run)}: ${pct1(FIRST.p07)} / ${pct1(SORTED[1].run)} = ${pct1(FIRST.pp)} and ${pct1(SECOND.p07)} / ${pct1(SORTED[1].run)} = ${pct1(SECOND.pp)}. Now they add up to 100% again.</p></div></div>` });

add({ group: "Text Generation", short: "Sample", title: "Sampling: pick one at random",
  lede: "The next token is drawn at random, following the kept probabilities. A token with 53% probability is picked a little more than half the time.",
  hand: `ID ${D.pick.id}`,
  render: () => {
    const kept = D.final.filter((x) => x.pp > 0);
    let acc = 0, at = 0;
    const segs = kept.map((x, k) => {
      if (x.id === D.pick.id) at = acc + x.pp / 2;
      acc += x.pp;
      const bg = x.id === D.pick.id ? "var(--warm)" : `color-mix(in srgb, var(--accent) ${k % 2 ? 60 : 85}%, var(--bg))`;
      return `<span style="width:${x.pp * 100}%; background: ${bg}">${esc(x.token)} ${pct(x.pp)}</span>`;
    }).join("");
    return `<div class="box"><div class="label">Each kept token gets a slice as wide as its probability</div>
      <div class="roulette">${segs}<span class="needle" id="needle" data-at="${at}"></span></div>
      <div class="flow"><span class="note">This time the needle lands on</span>${tokChip(D.pick.token, "ID " + D.pick.id, true)}</div></div>
      <p class="note">Run the same prompt again and it lands on ${mono(kept.find((x) => x.id !== D.pick.id).token)} almost as often. That is why sampled stories differ from run to run.</p>`;
  },
  after: () => {
    const n = document.getElementById("needle");
    if (!n) return;
    const go = () => (n.style.left = `calc(${n.dataset.at * 100}% - 1.5px)`);
    matchMedia("(prefers-reduced-motion: reduce)").matches ? go() : requestAnimationFrame(() => requestAnimationFrame(go));
  } });

add({ group: "Text Generation", short: "Decode", title: "Decoding: back to text",
  lede: "Decoding runs the tokenizer backwards. The ID is looked up in the vocabulary, which gives its bytes, and the bytes are read as UTF-8 text.",
  hand: `"${esc(D.pick.text)}"`,
  render: () => `<div class="flow">${tokChip(D.pick.id, "token ID")}<span class="arrow">→</span>
    <span class="chips">${D.pick.bytes.map((b) => tokChip(String.fromCharCode(b) === " " ? "␣" : String.fromCharCode(b), b)).join("")}</span>
    <span class="arrow">→</span>${tokChip(D.pick.token, "text", true)}</div>` });

add({ group: "Text Generation", short: "Result", title: "One token later",
  lede: "The new token is appended, and the whole trip starts again from the embedding with one more ID. Generation stops at <|endoftext|> or after the maximum number of new tokens.",
  hand: `${inHandIds([...D.ids, D.pick.id])} (next round)`,
  render: () => `<div class="bigtext">${esc(D.prompt)}<span class="new">${esc(D.pick.text)}</span><span class="caret"></span></div>
    <div class="label">Next round reads</div><div class="chips">${[...D.tokens, D.pick.token].map((t, i) => tokChip(t, [...D.ids, D.pick.id][i], i === T)).join("")}</div>` });

/* Navigation */
let cur = 0;
const els = {};
["track", "stage", "title", "lede", "eyebrow", "inhand", "count", "back", "next"].forEach((id) => (els[id] = document.getElementById(id)));

function buildTrack() {
  const groups = [];
  steps.forEach((s, i) => {
    let g = groups[groups.length - 1];
    if (!g || g.name !== s.group) groups.push((g = { name: s.group, items: [] }));
    g.items.push(i);
  });
  els.track.innerHTML = groups.map((g) => `<div class="group"><div class="group-label">${esc(g.name)}</div><div class="stations">
    ${g.items.map((i) => `<button class="station" type="button" data-i="${i}">${esc(steps[i].short)}</button>`).join("")}</div></div>`).join("");
  els.track.addEventListener("click", (e) => { const b = e.target.closest(".station"); if (b) go(+b.dataset.i); });
}

function draw(animate) {
  const s = steps[cur];
  els.eyebrow.textContent = `${s.group} · step ${cur + 1}`;
  els.title.textContent = s.title;
  els.lede.textContent = s.lede;
  els.inhand.innerHTML = s.hand;
  els.stage.innerHTML = s.render(s.state || {});
  if (animate) { els.stage.classList.remove("enter"); void els.stage.offsetWidth; els.stage.classList.add("enter"); }
  els.count.textContent = `Step ${cur + 1} of ${steps.length}`;
  els.back.disabled = cur === 0;
  els.next.textContent = cur === steps.length - 1 ? "Start over" : "Next step";
  document.querySelectorAll(".station").forEach((b) => {
    const i = +b.dataset.i;
    b.classList.toggle("now", i === cur);
    b.classList.toggle("done", i < cur);
    if (i === cur) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  const now = document.querySelector(".station.now");
  if (now && animate) now.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (s.after) s.after();
}
function go(i) { cur = (i + steps.length) % steps.length; draw(true); }

els.stage.addEventListener("click", (e) => {
  const st = steps[cur].state;
  if (!st) return;
  const blockBtn = e.target.closest("[data-block]");
  const headBtn = e.target.closest("[data-head]");
  if (blockBtn) st.block = +blockBtn.dataset.block;
  else if (headBtn) st.head = +headBtn.dataset.head;
  else return;
  draw(false);
});
els.next.addEventListener("click", () => go(cur + 1));
els.back.addEventListener("click", () => cur > 0 && go(cur - 1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft" && cur > 0) go(cur - 1);
});

buildTrack();
draw(false);
</script>

</body>
</html>
